version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give new releases a week to be caught if compromised before we adopt them.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base image, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node majors are chosen by hand so the image stays on an LTS line
      # (22 -> 24 -> 26). Odd majors never become LTS, and Dependabot does not
      # accept version ranges for Docker tags, so all majors are skipped here.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
