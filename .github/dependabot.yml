version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give new releases a week to be caught if compromised before we adopt them.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base image, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Stay on Node LTS lines (even majors). Odd majors are short-lived
      # "current" releases that never become LTS.
      - dependency-name: "node"
        versions: [">=23 <24", ">=25 <26", ">=27 <28", ">=29 <30"]
