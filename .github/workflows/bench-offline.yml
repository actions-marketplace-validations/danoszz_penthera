name: E17 offline and determinism (manual)

# Runs bench/offline/run.mjs: every offline command twice with the network
# blocked by scripts/ci/net-guard.cjs and once with it allowed, then compares
# the results. Protocol: docs/research/prereg/E17-offline-and-determinism.md.
# Manual only. The summary is uploaded as an artifact, not committed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-offline
  cancel-in-progress: false

jobs:
  e17:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Run E17
        run: node bench/offline/run.mjs --out "$RUNNER_TEMP/e17"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e17-results
          path: ${{ runner.temp }}/e17
