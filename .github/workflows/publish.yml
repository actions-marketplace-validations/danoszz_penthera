name: Publish

# Publishes to npm with build provenance when a version tag is pushed.
# Provenance cryptographically links the published tarball to this workflow run
# and commit, and npm shows a "Built and signed on GitHub Actions" badge on the
# package page. It only works from CI with OIDC, never from a laptop.
#
# Setup: preferred is npm trusted publishing (OIDC, no long-lived secret):
#   npmjs.com > penthera > Settings > Trusted publishing > GitHub Actions,
#   repo danoszz/penthera, workflow publish.yml. Then delete the NPM_TOKEN secret.
#   Until that is configured, the NPM_TOKEN repository secret is used.
# Release: see CONTRIBUTING.md ("Cutting a release"). Pushing a v* tag publishes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24 # npm 11.5+ for trusted publishing
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
