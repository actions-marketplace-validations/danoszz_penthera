<title id="t">E11 estimates against their registered thresholds</title>
<desc id="d">Dot plot of the seven E11 estimates for Penthera 1.9.0, each with its 95% interval, against the threshold registered in E11 § 1 (dashed). H1: 0.58 [0.55, 0.6], threshold &gt; 0.7; H2: 0.27 [0.26, 0.29], threshold &gt; 0.5; H3: 0.13 [0.08, 0.2], threshold &gt; 0.5; H4 npm: 0.44 [0.39, 0.5], threshold &gt; 0.7; H4 PyPI: 0.8 [0.75, 0.84], threshold &gt; 0.7; H5 npm: 0 [0, 0.01], threshold &lt; 0.1; H5 PyPI: 0.08 [0.06, 0.12], threshold &lt; 0.1. Only H4 PyPI and H5 npm clear their threshold, so no hypothesis holds for both ecosystems.</desc>
