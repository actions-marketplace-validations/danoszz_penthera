<title id="t">Secret scanners on CredData: precision against recall</title>
<desc id="d">Scatter plot of strict precision against in-scope recall, with 95% whiskers and dashed equal-F1 curves, for 12 secret-scanner runs on the CredData test half (n = 2220 true rows). Penthera 2.0.0: precision 0.89, recall 0.64; Penthera 1.9.0: precision 0.56, recall 0.10; gitleaks: precision 0.85, recall 0.37; detect-secrets: precision 0.30, recall 0.53; trufflehog: precision 0.40, recall 0.05; noseyparker: precision 0.76, recall 0.62; kingfisher: precision 0.96, recall 0.29; ripsecrets: precision 0.65, recall 0.35; credsweeper: precision 1.00, recall 0.98; whispers: precision 0.46, recall 0.09; deepsecrets: precision 0.80, recall 0.77; secretlint: precision 0.92, recall 0.19.</desc>
