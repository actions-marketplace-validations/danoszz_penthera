<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
<title id="t">E14 arms on CredData: precision against recall</title>
<desc id="d">Scatter plot of strict precision against in-scope recall, with 95% whiskers, for the E14 arms on the CredData test half (n = 2,220 true rows). P: Penthera alone: precision 0.89, recall 0.64; gitleaks alone: precision 0.85, recall 0.37; trufflehog alone: precision 0.40, recall 0.05; P + gitleaks: precision 0.84, recall 0.74; P + trufflehog: precision 0.80, recall 0.64; U: union: precision 0.80, recall 0.75; A: agreement: precision 0.89, recall 0.64. A shaded band marks precision within 0.02 of Penthera alone; the union falls below it.</desc>
