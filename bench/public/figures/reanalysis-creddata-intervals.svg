<svg xmlns="http://www.w3.org/2000/svg" width="640" height="442" viewBox="0 0 640 442" role="img" aria-labelledby="t d">
<title id="t">CredData test half: one estimate, three intervals</title>
<desc id="d">Dot plot of Penthera's and gitleaks' precision, in-scope recall and F1 on the CredData test half, each with up to three 95% intervals: Wilson (as registered in E11b), a bootstrap over files (as in E14) and a bootstrap over repositories (exploratory). Penthera precision 0.89: Wilson (registered) [0.87, 0.90], files [0.83, 0.93], repositories [0.83, 0.93]; Penthera recall in scope 0.64: Wilson (registered) [0.62, 0.66], files [0.59, 0.70], repositories [0.58, 0.70]; Penthera F1 0.74: files [0.71, 0.78], repositories [0.70, 0.78]; gitleaks precision 0.85: Wilson (registered) [0.84, 0.86], files [0.81, 0.92], repositories [0.82, 0.89]; gitleaks recall in scope 0.37: Wilson (registered) [0.35, 0.39], files [0.20, 0.56], repositories [0.17, 0.59]; gitleaks F1 0.52: files [0.33, 0.67], repositories [0.28, 0.69]. Resampling files or repositories gives wider intervals than Wilson's, most of all for gitleaks' recall.</desc>
