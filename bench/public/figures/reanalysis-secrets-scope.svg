<svg xmlns="http://www.w3.org/2000/svg" width="640" height="338" viewBox="0 0 640 338" role="img" aria-labelledby="t d">
<title id="t">Secret scanners on CredData: recall in scope and over all true rows</title>
<desc id="d">Dumbbell plot of recall on the CredData test half for 11 secret scanners: the registered in-scope recall (filled dot, 2220 rows) and the recall over every true row (ring, 6645 rows). credsweeper (trained on CredData): 0.98 in scope, 0.99 over all true rows; deepsecrets: 0.77 in scope, 0.42 over all true rows; Penthera 2.0.0: 0.64 in scope, 0.25 over all true rows; noseyparker: 0.62 in scope, 0.29 over all true rows; detect-secrets: 0.53 in scope, 0.29 over all true rows; gitleaks: 0.37 in scope, 0.35 over all true rows; ripsecrets: 0.35 in scope, 0.29 over all true rows; kingfisher: 0.29 in scope, 0.12 over all true rows; secretlint: 0.19 in scope, 0.07 over all true rows; whispers: 0.09 in scope, 0.04 over all true rows; trufflehog: 0.05 in scope, 0.03 over all true rows. Every tool's recall drops over all rows; Penthera's drops the most, because most true rows are in families it has no rule for.</desc>
