<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>penthera ui</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#center">Skip to content</a>
  <div class="app" id="app">
    <aside class="left pane" id="left" aria-label="Projects and runs"></aside>
    <main class="center pane" id="center" tabindex="-1">
      <noscript><p class="pad">penthera ui needs JavaScript: every view reads from the local API on this machine.</p></noscript>
    </main>
    <aside class="right pane" id="right" aria-label="Details"></aside>
    <div class="scrim" id="scrim" hidden></div>
  </div>
  <div class="sr" role="status" aria-live="polite" id="announce"></div>
</body>
</html>
