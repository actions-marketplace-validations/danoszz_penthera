# Test fixture, not a dependency of Penthera: these pinned, known-vulnerable
# versions are the input the tests assert on (AIBOM / CRA SBOM reporting).
# Nothing here is installed or shipped. Keeps OSV-Scanner (and the OpenSSF
# Scorecard Vulnerabilities check, which runs it) on Penthera's real tree.
[[PackageOverrides]]
ecosystem = "PyPI"
ignore = true
reason = "Test fixture input; never installed or shipped."

[[PackageOverrides]]
ecosystem = "npm"
ignore = true
reason = "Test fixture input; never installed or shipped."
